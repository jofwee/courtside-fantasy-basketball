name: Refresh basketball data

on:
  schedule:
    # 10:17 UTC = 18:17 Asia/Manila. GitHub schedules are best effort.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtside-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test refresh safety checks
        run: python -m unittest discover -s tests -p 'test_refresh.py'
      - name: Refresh validated datasets in Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/refresh_data.py
      - name: Keep sanitized refresh report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: basketball-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/refresh-latest.json
          retention-days: 14
          if-no-files-found: ignore
